schema: spec-driven

context: |
  Project: CarSales (slug: carsales). Microservices on ASP.NET Core Web API, .NET 10.
  Global rules (sdd-global-rules) apply; this file records project-specific decisions only.

  Repository: monorepo.
    - services/ms-<name>/   one folder per microservice
    - api-gateway/          YARP
    - infrastructure/       Docker setup of infrastructure tools
    - CarSales.slnx         root solution referencing every project
    - docker-compose.yml    root compose that includes every service and infrastructure compose file

  Database: PostgreSQL. One server in Docker holds the development and production
  databases, a database per service. Production databases may later move to a separate
  server, with or without their data.
  Communication: HTTP for synchronous calls, Kafka for events.
  Mapping: AutoMapper 14.0.0. Never upgrade to 15 or later (commercial license).

  Infrastructure is added only when a change needs it. PostgreSQL is the only tool from the start.
    - Kafka: when the first event is needed.
    - Vault: when the first secret is needed. VAULT_TOKEN is the only value kept in .env,
      loaded in code with DotNetEnv so it works the same with dotnet run, the IDE, and tests.
    - Keycloak: only when authentication is requested. Until then endpoints have no authorization.
      One instance with its own database; environments are separated by realms.
    - Redis, Elasticsearch: when a change needs them.

  Write all OpenSpec artifacts in English.

