name: carsales

services:
  # One-shot: applies migrations and exits; ms-listing starts only after it succeeds.
  ms-listing-migrate:
    build:
      context: ../..
      dockerfile: services/ms-listing/Dockerfile
    restart: "no"
    env_file: .env
    command: ["--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    networks:
      - carsales_network

  ms-listing:
    build:
      context: ../..
      dockerfile: services/ms-listing/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      ms-listing-migrate:
        condition: service_completed_successfully
    networks:
      - carsales_network

networks:
  carsales_network:
    external: true
