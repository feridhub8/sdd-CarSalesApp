name: carsales

services:
  ms-auth:
    build:
      context: ../..
      dockerfile: services/ms-auth/Dockerfile
    restart: unless-stopped
    ports:
      - "7001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    networks:
      - carsales_network

networks:
  carsales_network:
    external: true
