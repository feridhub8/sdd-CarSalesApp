# Built files carry a hash in their name, so they never change; the page must always be fresh.
map $uri $cache_control {
    ~^/assets/ "public, max-age=31536000, immutable";
    default    "no-cache";
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header Cache-Control $cache_control always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; style-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # A path ending in a file name is a file: a missing one is 404, not the page.
    location ~ \.[a-zA-Z0-9]+$ {
        try_files $uri =404;
    }

    # Everything else is a page address, which the app resolves in the browser.
    location / {
        try_files $uri /index.html;
    }
}
